[project]
name = "projeto_hospital"
version = "2.0.0"
description = "Sistema CRM para Gestão Hospitalar - Centro Cirúrgico"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15",
    "django-filter>=24.1",
    "djangorestframework-simplejwt>=5.3",
    "psycopg2-binary>=2.9",
    "gunicorn>=22.0",
    "celery>=5.3",
    "redis>=5.0",
    "python-decouple>=3.8",
    "django-cors-headers>=4.3",
    "drf-spectacular>=0.27",
    "django-impersonate>=1.9",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=4.3",
    "ipdb>=0.13",
    "coverage>=7.4",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "pre-commit>=3.6",
]
prod = [
    "sentry-sdk>=2.0",
    "whitenoise>=6.6",
]
ai = [
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["apps", "core"]
omit = ["*/migrations/*", "*/tests/*"]
