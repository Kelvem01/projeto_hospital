{% extends 'base.html' %}
{% block title %}Novo Paciente - Gestão Hospitalar{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-person-plus me-2"></i>Novo Paciente</h1>
</div>
<div class="card">
    <div class="card-body">
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Nome completo</label>
                <input type="text" name="nome" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">CPF</label>
                <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">RG</label>
                <input type="text" name="rg" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Telefone</label>
                <input type="text" name="telefone" class="form-control" placeholder="(11) 99999-9999">
            </div>
            <div class="col-md-4">
                <label class="form-label">Data de Nascimento</label>
                <input type="date" name="data_nascimento" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Convênio</label>
                <select name="convenio" class="form-select">
                    <option value="">Selecione...</option>
                    {% for c in convenios %}
                    <option value="{{ c.id }}">{{ c.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nº Carteirinha</label>
                <input type="text" name="numero_carteirinha" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Profissão</label>
                <input type="text" name="profissao" class="form-control">
            </div>
            <div class="col-12 text-end mt-4">
                <a href="{% url 'patient-list' %}" class="btn btn-outline-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-2"></i>Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
