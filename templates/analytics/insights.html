{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1><i class="bi bi-robot"></i> Insights de IA</h1>
        <p class="text-muted">Análises inteligentes geradas por IA para apoio à decisão</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-building fs-1 text-primary"></i>
                <h5 class="mt-2">Análise de Ocupação</h5>
                <button class="btn btn-primary w-100" hx-post="/api/analytics/ia/analise-ocupacao/" hx-target="#resultado-ia">
                    <i class="bi bi-magic"></i> Gerar
                </button>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-currency-dollar fs-1 text-success"></i>
                <h5 class="mt-2">Análise Financeira</h5>
                <button class="btn btn-success w-100" hx-post="/api/analytics/ia/analise-financeira/" hx-target="#resultado-ia">
                    <i class="bi bi-magic"></i> Gerar
                </button>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-file-text fs-1 text-info"></i>
                <h5 class="mt-2">Relatório Gerencial</h5>
                <button class="btn btn-info w-100 text-white" hx-post="/api/analytics/ia/relatorio-gerencial/" hx-target="#resultado-ia">
                    <i class="bi bi-magic"></i> Gerar
                </button>
            </div>
        </div>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header"><i class="bi bi-chat-dots"></i> Resultado</div>
    <div class="card-body" id="resultado-ia">
        <p class="text-muted">Clique em um botão para gerar uma análise.</p>
    </div>
</div>
{% endblock %}
