{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão Hospitalar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-card fade-in">
        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-hospital"></i>
            </div>
            <h4 class="mb-1">Gestão Hospitalar</h4>
            <p class="mb-0 text-white-50">Centro Cirúrgico</p>
        </div>
        <div class="login-body">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-danger bg-soft-danger border-0">
                        <i class="bi bi-exclamation-triangle me-2"></i>E-mail ou senha inválidos.
                    </div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" name="username" class="form-control border-start-0" placeholder="admin@hospital.com" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <div class="input-group position-relative">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 border-end-0" placeholder="••••••" required>
                        <button type="button" class="input-group-text bg-light password-toggle border-start-0">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Lembrar acesso</label>
                    </div>
                    <a href="#" class="text-decoration-none small" style="color: var(--accent);">Recuperar senha</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
